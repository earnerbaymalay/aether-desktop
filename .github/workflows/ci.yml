name: Aether - Tauri CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check critical files
        run: |
          REQUIRED="README.md CONTRIBUTING.md package.json index.html"
          MISSING=0
          for f in $REQUIRED; do
            if [ ! -f "$f" ]; then
              echo "✗ Missing: $f"
              MISSING=$((MISSING+1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            exit 1
          else
            echo "✓ All critical files present"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Check PWA manifest
        run: |
          if [ -f "dist/manifest.webmanifest" ]; then
            echo "✓ PWA manifest generated"
          else
            echo "✗ PWA manifest missing"
            exit 1
          fi

      - name: Check README has PWA info
        run: |
          if grep -q "PWA" README.md; then
            echo "✓ README contains PWA information"
          else
            echo "✗ README missing PWA information"
            exit 1
          fi
